spring.config.import=optional:file:.env[.properties]

spring.application.name=internal-inquiry-management

# PostgreSQL接続設定
spring.datasource.url=jdbc:postgresql://localhost:5433/inquiry_db
spring.datasource.username=inquiry_user
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA設定
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false